<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scan QR · WIRSTICK</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff8f0 0%, #ffefe3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        body::before {
            content: "🥨";
            font-size: 200px;
            position: fixed;
            bottom: -40px;
            left: -50px;
            opacity: 0.05;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        body::after {
            content: "🍟";
            font-size: 170px;
            position: fixed;
            top: -30px;
            right: -40px;
            opacity: 0.06;
            pointer-events: none;
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 64px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 200, 170, 0.6);
            position: relative;
            z-index: 2;
        }

        .logo {
            background: #e25822;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 15px 25px -8px rgba(226, 88, 34, 0.4);
        }

        .logo i {
            font-size: 3.2rem;
            color: white;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c23b12, #e87a3e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #b85c34;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .qr-container {
            background: white;
            padding: 1.5rem;
            border-radius: 40px;
            display: inline-block;
            margin: 1rem 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            width: 220px;
            height: 220px;
            border-radius: 20px;
        }

        .qr-url {
            background: #fff0e6;
            padding: 12px 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            word-break: break-all;
            color: #c23b12;
            margin: 1rem 0;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        .btn-copy, .btn-menu {
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Quicksand', sans-serif;
            transition: 0.2s;
            border: none;
        }

        .btn-copy {
            background: #e25822;
            color: white;
        }

        .btn-copy:hover {
            background: #bc431b;
            transform: scale(0.97);
        }

        .btn-menu {
            background: #2c1a10;
            color: white;
            text-decoration: none;
        }

        .btn-menu:hover {
            background: #1f110a;
            transform: scale(0.97);
        }

        .instruction {
            background: #fff5ef;
            border-radius: 32px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: left;
        }

        .instruction h3 {
            color: #c23b12;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instruction p {
            font-size: 0.75rem;
            color: #6b3e2c;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instruction i {
            width: 24px;
            color: #e25822;
        }

        footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: #bb8264;
        }

        @media (max-width: 500px) {
            .qr-card {
                padding: 1.5rem;
            }
            #qrcode img {
                width: 180px;
                height: 180px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="qr-card">
    <div class="logo">
        <i class="fas fa-utensils"></i>
    </div>
    <h1>WIRSTICK</h1>
    <div class="subtitle">
        <i class="fas fa-cookie-bite"></i> Crunchy Stick Snack
    </div>

    <div class="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="qr-url" id="urlText">
        <i class="fas fa-link"></i> gibranhayder.github.io/WIRSTICK/
    </div>

    <div class="btn-group">
        <button class="btn-copy" id="copyBtn">
            <i class="fas fa-copy"></i> Salin Link
        </button>
        <a href="https://gibranhayder.github.io/WIRSTICK/" class="btn-menu" target="_blank">
            <i class="fas fa-arrow-right"></i> Buka Menu
        </a>
    </div>

    <div class="instruction">
        <h3><i class="fas fa-camera"></i> Cara Pesan</h3>
        <p><i class="fas fa-qrcode"></i> 1. Scan QR code pakai kamera HP</p>
        <p><i class="fas fa-hand-pointer"></i> 2. Klik "Buka Menu" atau scan otomatis</p>
        <p><i class="fas fa-cart-plus"></i> 3. Pilih stik favorit & isi data</p>
        <p><i class="fab fa-whatsapp"></i> 4. Checkout via WhatsApp</p>
    </div>

    <footer>
        <i class="fas fa-store"></i> Scan QR ini untuk pesan WIRSTICK
    </footer>
</div>

<script>
    // URL menu utama Anda
    const menuURL = "https://gibranhayder.github.io/WIRSTICK/";
    
    // Generate QR Code
    new QRCode(document.getElementById("qrcode"), {
        text: menuURL,
        width: 220,
        height: 220,
        colorDark: "#2c1a10",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    // Tombol copy link
    const copyBtn = document.getElementById("copyBtn");
    copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(menuURL).then(() => {
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
            }, 2000);
        });
    });
</script>

</body>
</html>
